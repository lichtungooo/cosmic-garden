name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # garten (dieses Repo) — in Subdir, damit Sibling-Repos daneben passen
      - name: Checkout garten
        uses: actions/checkout@v4
        with:
          path: garten

      # Real-Life-Stack und Web-of-Trust auf feste Stände, die zueinander passen.
      # Der Fork-Stand (master, 10.04.2026) braucht web-of-trust vom 08.04.2026.
      # Ab Mai hat web-of-trust seine Pakete umgebaut (WotIdentity und
      # VerificationHelper raus, Unterpfade wie @web_of_trust/core/services).
      # Ein neuer Stand kommt nur zusammen mit einem lokalen Bau.
      - name: Checkout real-life-stack (Timo-Fork)
        uses: actions/checkout@v4
        with:
          repository: lichtungooo/real-life-stack
          ref: 11941dcfcbf4dff28f17d3ecf2f9d30d8a653c9b
          path: real-life-stack

      - name: Checkout web-of-trust
        uses: actions/checkout@v4
        with:
          repository: real-life-org/web-of-trust
          ref: 04aa16c83dae63c4c56e50d8743fbc222b9a2c28
          path: web-of-trust

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build-Context = Parent-Verzeichnis mit allen drei Repos
          context: .
          file: ./garten/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
